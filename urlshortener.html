<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Url Shortener</title>
    <link rel="stylesheet" href="Styles/global.css" />
    <link rel="stylesheet" href="Styles/themes.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body data-tool="urlshortener">
    <header>
      <div class="header-actions-corner">
        <button class="change-themes-btn">
          <i class="fa-solid fa-palette"></i> Theme
        </button>
        <div class="nav-dropdown">
          <button class="nav-dropdown-btn" id="toolsBtn">
            All Tools <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="nav-dropdown-menu" id="toolsMenu">
            <!-- filled automatically by nav.js -->
          </div>
        </div>
      </div>

      <div class="waveanimheader" onclick="location.reload()">
        <span class="url-U">U</span>
        <span class="url-r">r</span>
        <span class="url-l">l</span>
        <span class="url-space">-</span>
        <span class="url-s">S</span>
        <span class="url-h">h</span>
        <span class="url-o">o</span>
        <span class="url-r2">r</span>
        <span class="url-t">t</span>
        <span class="url-e">e</span>
        <span class="url-n">n</span>
        <span class="url-e2">e</span>
        <span class="url-r3">r</span>
      </div>

      <nav class="nav" id="mainNav">
        <a href="index.html" class="navlink" data-tool-link="home">Home</a>
        <!-- recently used tools injected here by nav.js -->
      </nav>

      <div class="change-themes" id="themesPanel">
        <div class="default" id="defaulttheme"></div>
        <div class="white" id="whitetheme"></div>
        <div class="purple" id="purpletheme"></div>
        <div class="red" id="redtheme"></div>
        <div class="blue" id="bluetheme"></div>
        <div class="orange" id="orangetheme"></div>
        <div class="pink" id="pinktheme"></div>
        <div class="yellow" id="yellowtheme"></div>
        <div class="black" id="blacktheme"></div>
        <div class="cyan" id="cyantheme"></div>
      </div>
    </header>
    <main>
      <h1 class="flicker">Url Shortener</h1>
      <div class="upload-box">
        <span class="info">Paste a link to Shorten </span>
        <form id="convertForm">
          <input
            type="text"
            id="urlInput"
            placeholder="https://www.example.com"
            required
          />
          <button type="submit" class="submituploadbtn">
            Shorten <i class="fa-solid fa-link"></i>
          </button>
        </form>
      </div>
      <div class="copy-results">
        <h1 class="flicker">Your Shortened URL</h1>
        <input type="text" id="shortenedUrl" readonly />
        <button id="copyBtn" class="submituploadbtn">
          Copy <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </main>
    <footer>
      <p>&copy; 2026 Bora's Tools. All rights reserved.</p>
      <div class="quick-links">
        <a class="quicklinktag" href="index.html">Home</a>
        <a class="quicklinktag" href="filesharing.html">File Sharing</a>
        <a class="quicklinktag" href="foldersharing.html">Folder Sharing</a>

          >QR Code Generator</a

        <a class="quicklinktag" href="youtubeconverter.html"
          >YouTube Converter</a
        >
        <a class="quicklinktag" href="imageconverter.html">Image Converter</a>
        <a class="quicklinktag" href="videotoaudio.html">Video To Audio</a>
        <a class="quicklinktag" href="spotifymusicdownloader.html"
          >Spotify Music Downloader</a
        >
        <a class="quicklinktag active" href="urlshortener.html"
          >Url Shortener</a
        >
        <a class="quicklinktag" href="imagecompressor.html">Image Compressor</a>
      </div>
    </footer>
    <script src="Js/urlshortener.js"></script>
    <script src="Js/changethemes.js"></script>
    <script src="Js/globalrestore.js"></script>
    <script src="Js/nav.js"></script>
  </body>
</html>
